  for (const s of segs) {
    if (typeof s.grade === 'number') {
      const dz = s.grade / 100 * s.distance;
      if (dz > 0) asc += dz; else desc += -dz;
      if (s.grade > maxG) maxG = s.grade;
      if (s.grade < minG) minG = s.grade;
    }
    if (typeof s.windSpeed === 'number') {
      avgWindAcc += s.windSpeed * s.distance; distAcc += s.distance;
    }
    if (typeof s.score === 'number') {
      if (s.score > 0.1) tailDist += s.distance;
      else if (s.score < -0.1) headDist += s.distance;
    }
  }
  if (a.restMin > 0 && a.restEvery > 0) {
    restCount = Math.max(0, Math.floor((totalKm - 0.1) / a.restEvery));
  }
  const avgWindKmh = distAcc ? avgWindAcc / distAcc : 0;
  const tailPct = (tailDist / last.cumDistance * 100).toFixed(1);
  const headPct = (headDist / last.cumDistance * 100).toFixed(1);
  const avgKmh  = totalH > 0 ? (totalKm / totalH).toFixed(1) : '0';

  // 10km 간격 샘플
  const samples = [];
  let nextSample = 0;
  for (const s of segs) {
    if (s.cumDistance / 1000 >= nextSample) {
      const km = (s.cumDistance / 1000).toFixed(0);
      const time = fmtT(new Date(s.etaMs));
      const ele  = typeof s.b.ele === 'number' ? Math.round(s.b.ele) + 'm' : '—';
      const grade = typeof s.grade === 'number' ? (s.grade >= 0 ? '+' : '') + s.grade.toFixed(1) + '%' : '—';
      const temp = typeof s.temperature === 'number' ? s.temperature.toFixed(1) + '°C' : '—';
      const wx   = s.weatherCode != null ? weatherText(s.weatherCode) : '—';
      const ws   = typeof s.windSpeed === 'number' ? (s.windSpeed/3.6).toFixed(1) + 'm/s' : '—';
      const tag  = typeof s.score === 'number'
        ? (s.score > 0.1 ? '순풍' : s.score < -0.1 ? '역풍' : '측풍') : '—';
      samples.push(`- ${String(km).padStart(3)}km / ${time} / 고도 ${ele} (${grade}) / ${wx} ${temp} / 풍 ${ws} ${tag}`);
      nextSample += 10;
    }
  }

  const restNote = (a.restMin > 0 && a.restEvery > 0)
    ? `${a.restEvery}km마다 ${a.restMin}분 휴식 (총 ${restCount}회 ≈ ${restCount * a.restMin}분)`
    : '휴식 없음';
  const modeNote = a.mode === 'power'
    ? `파워 ${a.power}W 기준 (체중+자전거 ${a.mass}kg)`
    : `평속 ${a.speed} km/h 기준`;

  const dirLabel = a.direction === 'reverse' ? '역방향' : a.direction === 'round' ? '왕복 (정방향+역방향)' : '정방향';
  return `[자전거 라이딩 코스 분석]
출발: ${fmtDT(startD)} (KST)
도착 예상: ${fmtDT(arriveD)}
방향: ${dirLabel}
총 거리: ${totalKm.toFixed(1)} km
예상 소요: ${Math.floor(totalH)}h ${Math.round((totalH - Math.floor(totalH)) * 60)}m (평균 ${avgKmh} km/h)
계산 기준: ${modeNote}
휴식: ${restNote}

[지형]
누적 상승: ${asc.toFixed(0)} m
누적 하강: ${desc.toFixed(0)} m
최대 경사: +${isFinite(maxG) ? maxG.toFixed(1) : '0'}% / ${isFinite(minG) ? minG.toFixed(1) : '0'}%

[풍 (Open-Meteo ECMWF 기준)]
평균 풍속: ${(avgWindKmh/3.6).toFixed(1)} m/s
순풍 구간: ${(tailDist/1000).toFixed(1)} km (${tailPct}%)
역풍 구간: ${(headDist/1000).toFixed(1)} km (${headPct}%)

[10km 구간별 시각·고도·경사·날씨·풍]
${samples.join('\n')}

[질문]
이 라이딩 코스에 대해 다음 항목을 한국어로 구체적으로 추천해주세요:
1. 복장 (상의·하의·장갑·모자·바람막이 등) — 출발 시각의 기온과 도중 변화 고려
2. 수분·식량 보급 타이밍 (몇 km / 몇 시 지점에 무엇을, 얼마나)
3. 페이스 전략 — 오르막·내리막·역풍 구간을 어떻게 분배할지
4. 주의 구간 — 가파른 경사·강한 역풍·급격한 기온 변화 등이 있는 km 지점
5. 출발 직전 식사와 라이딩 후 회복 식사 가이드`;
}

(function setupAiPromptModal() {
  const btn   = document.getElementById('aiPrompt');
  const modal = document.getElementById('aiModal');
  const close = document.getElementById('aiClose');
  const ta    = document.getElementById('aiPromptText');
  const copy  = document.getElementById('aiCopy');

  btn.addEventListener('click', () => {
    if (!analysis) return;
    ta.value = buildAiPrompt();
    modal.style.display = 'flex';
    setTimeout(() => ta.focus(), 50);
  });
  close.addEventListener('click', () => { modal.style.display = 'none'; });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.style.display === 'flex') modal.style.display = 'none';
  });

  copy.addEventListener('click', async () => {
    const text = ta.value;
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      // fallback
      ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {}
    }
    if (ok) {
      copy.textContent = '✓ 복사됨';
      copy.classList.add('copied');
      setTimeout(() => {
        copy.textContent = '📋 클립보드에 복사';
        copy.classList.remove('copied');
      }, 1800);
    } else {
      copy.textContent = '⚠ 직접 선택해서 복사하세요';
    }
  });
})();

// 그래프 영역 세로 크기 리사이즈 (가로 핸들) — 마우스 + 터치
// 브라우저 창 크기 변경 → 그래프 + 지도 동기화 (200ms debounce)
(function setupWindowResize(){
  let timer = null;
  window.addEventListener('resize', () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      map.invalidateSize();
      if (lastSegments) renderElevation(lastSegments, lastAvgKmh);
    }, 200);
  });
})();

(function setupResizer(){
  const resizer = document.getElementById('elevResizer');
  const elevDiv = document.getElementById('elevation');
  let dragging = false, startY = 0, startH = 0, rafId = 0;

  const onStart = (clientY) => {
    dragging = true;
    startY = clientY;
    startH = elevDiv.clientHeight;
    document.body.style.userSelect = 'none';
    resizer.classList.add('active');
  };
  const onMove = (clientY) => {
    if (!dragging) return;
    const dy = startY - clientY; // 위로 → 그래프 커짐
    const newH = Math.max(80, Math.min(window.innerHeight - 240, startH + dy));
    elevDiv.style.height = newH + 'px';
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => map.invalidateSize());
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    resizer.classList.remove('active');
    map.invalidateSize();
    if (lastSegments) renderElevation(lastSegments, lastAvgKmh);
  };

  resizer.addEventListener('mousedown', (e) => { e.preventDefault(); onStart(e.clientY); });
  document.addEventListener('mousemove', (e) => onMove(e.clientY));
  document.addEventListener('mouseup', onEnd);

  resizer.addEventListener('touchstart', (e) => {
    if (!e.touches[0]) return;
    e.preventDefault();
    onStart(e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    if (!e.touches[0]) return;
    e.preventDefault();
    onMove(e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchend', onEnd);
  document.addEventListener('touchcancel', onEnd);
})();

// ============================================================
// 하단 고도 + 속도 그래프 (Canvas, dual layer)
//   - bg canvas: 정적 (그리드/축/라벨/area/라인) — 한 번만 그림
//   - fg canvas: 동적 (cursor/dot/label/brush) — 호버 시 갱신
//   - 색상별 batch stroke로 ~3K segment를 5~10번 stroke로 처리
// ============================================================
function renderElevation(segments, baseSpeed) {
  const div = document.getElementById('elevation');
  // 분석 완료 → 그래프/리사이저/토글 버튼 자동 표시 (초기 hidden 상태에서 진입)
  const wasHidden = div.classList.contains('hidden');
  div.classList.remove('hidden');
  const _resizer = document.getElementById('elevResizer');
  if (_resizer) _resizer.classList.remove('hidden');
  const _toggleBtn = document.getElementById('elevToggle');
  if (_toggleBtn) {
    _toggleBtn.classList.remove('hidden');
    _toggleBtn.textContent = '📊 그래프 숨김';
  }
  if (wasHidden) setTimeout(() => map.invalidateSize(), 50);
  div.innerHTML = '';
  hoverLayer.clearLayers();

  if (!segments.some(s => typeof s.a.ele === 'number')) {
    div.innerHTML = '<div class="elev-empty">GPX 파일에 고도(ele) 정보가 없습니다.</div>';
    return;
  }

  const W = div.clientWidth, H = div.clientHeight;
  const padL = 44, padR = 44, padT = 10, padB = 22;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const totalKm = segments[segments.length - 1].cumDistance / 1000;

  let minE = Infinity, maxE = -Infinity;
  for (const s of segments) {
    if (typeof s.a.ele === 'number') { if (s.a.ele < minE) minE = s.a.ele; if (s.a.ele > maxE) maxE = s.a.ele; }
    if (typeof s.b.ele === 'number') { if (s.b.ele < minE) minE = s.b.ele; if (s.b.ele > maxE) maxE = s.b.ele; }
  }
  const eleMin = Math.floor(minE / 10) * 10;
  const eleMax = Math.ceil(Math.max(maxE, minE + 10) / 10) * 10;
  const eleSpan = eleMax - eleMin;
  let minV = Infinity, maxV = -Infinity;
  for (const s of segments) {
    const v = s.effectiveSpeed;
    if (typeof v === 'number') { if (v < minV) minV = v; if (v > maxV) maxV = v; }
  }
  if (!isFinite(minV)) { minV = baseSpeed - 5; maxV = baseSpeed + 5; }
  minV = Math.min(minV, baseSpeed); maxV = Math.max(maxV, baseSpeed);
  const vMin = Math.floor((minV - 1) / 2) * 2;
  const vMax = Math.ceil((maxV + 1) / 2) * 2;
  const vSpan = Math.max(vMax - vMin, 4);

  // X축 뷰 범위(km) — 줌 인터랙션에 의해 변경됨
  let xViewStart = 0;
  let xViewEnd   = totalKm;
  const xOf  = km => padL + ((km - xViewStart) / Math.max(1e-9, (xViewEnd - xViewStart))) * innerW;
  const yEle = e  => padT + (1 - (e - eleMin) / eleSpan) * innerH;
  const yV   = v  => padT + (1 - (v - vMin)   / vSpan)   * innerH;

  // ---- canvas 세 개(bg / marker / fg) + tooltip ----
  const dpr = window.devicePixelRatio || 1;
  const mkCanvas = (pe) => {
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    c.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;display:block;`
                    + (pe === false ? 'pointer-events:none;' : '');
    return c;
  };
  const bgCanvas = mkCanvas(false);
  const markerCanvas = mkCanvas(false);
  const fgCanvas = mkCanvas();
  fgCanvas.style.cursor = 'crosshair';
  fgCanvas.style.touchAction = 'none';
  div.appendChild(bgCanvas);
  div.appendChild(markerCanvas);
  div.appendChild(fgCanvas);
  const bg = bgCanvas.getContext('2d');
  const mk = markerCanvas.getContext('2d');
  const fg = fgCanvas.getContext('2d');
  bg.scale(dpr, dpr); mk.scale(dpr, dpr); fg.scale(dpr, dpr);

  const tooltip = document.createElement('div');
  tooltip.className = 'elev-tooltip';
  tooltip.innerHTML =
      '<span class="t-km e"></span>'
    + '<span class="sep">|</span>고도 <span class="t-ele e"></span>'
    + '<span class="sep">|</span>경사 <span class="t-grade"></span>'
    + '<span class="sep">|</span>속도 <span class="t-speed"></span>'
    + '<span class="sep">|</span>풍 <span class="t-wind"></span>'
    + '<span class="sep">|</span>날씨 <span class="t-wx e"></span>'
    + '<span class="sep">|</span>기온 <span class="t-temp e"></span>'
    + '<span class="t-rain"></span>'
    + '<span class="t-hum"></span>'
    + '<span class="sep">|</span>도착 <span class="t-eta e"></span>';
  div.appendChild(tooltip);
  const tEl = {
    km: tooltip.querySelector('.t-km'),
    ele: tooltip.querySelector('.t-ele'),
    grade: tooltip.querySelector('.t-grade'),
    speed: tooltip.querySelector('.t-speed'),
    wind: tooltip.querySelector('.t-wind'),
    wx: tooltip.querySelector('.t-wx'),
    temp: tooltip.querySelector('.t-temp'),
    rain: tooltip.querySelector('.t-rain'),
    hum: tooltip.querySelector('.t-hum'),
    eta: tooltip.querySelector('.t-eta'),
  };

  // ===== bg 그리기 (한 번만) =====
  function drawBg() {
    bg.clearRect(0, 0, W, H);
    bg.font = '10px -apple-system,system-ui,sans-serif';
    bg.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const t = i / 4;
      const y = padT + (1 - t) * innerH;
      bg.strokeStyle = '#eee';
      bg.beginPath(); bg.moveTo(padL, y); bg.lineTo(W - padR, y); bg.stroke();
      bg.fillStyle = '#888'; bg.textAlign = 'right';
      bg.fillText((eleMin + eleSpan * t).toFixed(0) + 'm', padL - 6, y + 3);
      bg.fillStyle = '#1976d2'; bg.textAlign = 'left';
      bg.fillText((vMin + vSpan * t).toFixed(0), W - padR + 6, y + 3);
    }
    bg.font = '9px -apple-system,system-ui,sans-serif';
    bg.fillStyle = '#1976d2'; bg.textAlign = 'left';
    bg.fillText('km/h', W - padR + 6, padT - 1);
    bg.font = '10px -apple-system,system-ui,sans-serif';
    bg.fillStyle = '#888'; bg.textAlign = 'center';
    const viewSpan = Math.max(1e-9, xViewEnd - xViewStart);
    const xTicks = viewSpan > 50 ? 6 : 5;
    const xDigits = viewSpan < 5 ? 2 : viewSpan < 20 ? 1 : 0;
    for (let i = 0; i <= xTicks; i++) {
      const km = xViewStart + viewSpan * i / xTicks;
      bg.fillText(km.toFixed(xDigits) + 'km', xOf(km), H - 6);
    }
    // 줌 인디케이터 (전체 범위가 아닐 때만)
    if (xViewStart > 0.001 || xViewEnd < totalKm - 0.001) {
      bg.font = 'bold 10px -apple-system,system-ui,sans-serif';
      bg.fillStyle = '#1976d2'; bg.textAlign = 'left';
      bg.fillText(`🔍 ${(xViewEnd - xViewStart).toFixed(2)}km / ${totalKm.toFixed(2)}km · 더블클릭=리셋`, padL + 4, padT + 11);
    }
    // 라인/area는 가시영역으로 클리핑 (줌 시 padding 영역으로 삐져나오는 것 방지)
    bg.save();
    bg.beginPath();
    bg.rect(padL, padT, innerW, innerH);
    bg.clip();
    // 고도 area
    bg.beginPath();
    bg.moveTo(xOf(0), yEle(eleMin));
    bg.lineTo(xOf(0), yEle(segments[0].a.ele ?? eleMin));
    for (const s of segments) bg.lineTo(xOf(s.cumDistance / 1000), yEle(s.b.ele ?? eleMin));
    bg.lineTo(xOf(totalKm), yEle(eleMin));
    bg.closePath();
    bg.fillStyle = 'rgba(216,216,216,0.7)';
    bg.fill();
    // 고도 라인 (색상별 batch stroke)
    const elePaths = new Map();
    for (const s of segments) {
      const km1 = (s.cumDistance - s.distance) / 1000;
      const km2 = s.cumDistance / 1000;
      const e1 = s.a.ele ?? eleMin;
      const e2 = s.b.ele ?? eleMin;
      const color = (typeof s.score === 'number') ? scoreColor(s.score, s.windSpeed) : '#888';
      let coords = elePaths.get(color);
      if (!coords) { coords = []; elePaths.set(color, coords); }
      coords.push(xOf(km1), yEle(e1), xOf(km2), yEle(e2));
    }
    bg.lineWidth = 2.5; bg.lineCap = 'round';
    for (const [color, coords] of elePaths) {
      bg.strokeStyle = color;
      bg.beginPath();
      for (let i = 0; i < coords.length; i += 4) {
        bg.moveTo(coords[i], coords[i+1]); bg.lineTo(coords[i+2], coords[i+3]);
      }
      bg.stroke();
    }
    // 평속 점선
    bg.strokeStyle = 'rgba(25,118,210,0.4)';
    bg.lineWidth = 1; bg.setLineDash([4, 3]);
    bg.beginPath(); bg.moveTo(padL, yV(baseSpeed)); bg.lineTo(W - padR, yV(baseSpeed)); bg.stroke();
    bg.setLineDash([]);
    // 속도 라인 (색상별 batch)
    const vPaths = new Map();
    let prevV = null, prevKm = 0;
    for (const s of segments) {
      const km = s.cumDistance / 1000;
      const v = s.effectiveSpeed;
      if (typeof v !== 'number') { prevV = null; continue; }
      if (prevV != null) {
        const color = (typeof s.score === 'number') ? scoreColor(s.score, s.windSpeed) : '#94a3b8';
        let coords = vPaths.get(color);
        if (!coords) { coords = []; vPaths.set(color, coords); }
        coords.push(xOf(prevKm), yV(prevV), xOf(km), yV(v));
      }
      prevV = v; prevKm = km;
    }
    bg.lineWidth = 2.2; bg.globalAlpha = 0.95;
    for (const [color, coords] of vPaths) {
      bg.strokeStyle = color;
      bg.beginPath();
      for (let i = 0; i < coords.length; i += 4) {
        bg.moveTo(coords[i], coords[i+1]); bg.lineTo(coords[i+2], coords[i+3]);
      }
      bg.stroke();
    }
    bg.globalAlpha = 1;
    bg.restore(); // clip 해제
  }
  drawBg();

  // ===== marker 그리기 (현재 GPS 추적 위치) =====
  function drawMarker() {
    mk.clearRect(0, 0, W, H);
    if (currentTrackProgressKm == null) return;
    if (currentTrackProgressKm < xViewStart - 0.001 || currentTrackProgressKm > xViewEnd + 0.001) return;
    const x = xOf(currentTrackProgressKm);
    // 세로선 (점선)
    mk.strokeStyle = 'rgba(239,68,68,0.85)';
    mk.lineWidth = 2; mk.setLineDash([4, 3]);
    mk.beginPath(); mk.moveTo(x, padT + 16); mk.lineTo(x, H - padB); mk.stroke();
    mk.setLineDash([]);
    // 고도 점
    const targetM = currentTrackProgressKm * 1000;
    const s = findSegmentByDist(segments, targetM);
    if (s && typeof s.b.ele === 'number') {
      const y = yEle(s.b.ele);
      mk.beginPath(); mk.arc(x, y, 6, 0, Math.PI * 2);
      mk.fillStyle = '#ef4444'; mk.fill();
      mk.strokeStyle = '#fff'; mk.lineWidth = 2; mk.stroke();
    }
    // 상단 km 라벨
    mk.font = 'bold 11px -apple-system,system-ui,sans-serif';
    const label = '🛰 ' + currentTrackProgressKm.toFixed(2) + 'km';
    const tw = mk.measureText(label).width;
    const boxW = tw + 12, boxH = 16;
    let boxX = x - boxW/2;
    if (boxX < padL) boxX = padL;
    if (boxX + boxW > W - padR) boxX = W - padR - boxW;
    mk.fillStyle = 'rgba(239,68,68,0.95)';
    mk.fillRect(boxX, padT, boxW, boxH);
    mk.fillStyle = '#fff'; mk.textAlign = 'center';
    mk.fillText(label, boxX + boxW/2, padT + 12);
  }
  drawMarker();
  elevUpdateMarker = drawMarker;

  // 외부에서 X 뷰 범위 변경 (추적 모드 ±1km 슬라이딩용)
  window._elevSetView = (start, end) => {
    xViewStart = Math.max(0, start);
    xViewEnd = Math.min(totalKm, end);
    if (xViewEnd - xViewStart < 0.1) {  // 너무 좁으면 보호
      xViewStart = 0; xViewEnd = totalKm;
    }
    drawBg(); drawMarker();
  };

  // ===== 줌 적용/리셋 — 그래프 가시 구간을 지도에도 동기화 =====
  let mapSyncTimer = null;
  function syncMapToView(immediate) {
    if (mapSyncTimer) { clearTimeout(mapSyncTimer); mapSyncTimer = null; }
    const apply = () => {
      const ll = [];
      for (const s of segments) {
        const k = s.cumDistance / 1000;
        if (k >= xViewStart - 0.05 && k <= xViewEnd + 0.05) {
          ll.push([s.a.lat, s.a.lon]); ll.push([s.b.lat, s.b.lon]);
        }
      }
      // programmaticMapView로 감싸 추적 자동 팔로우의 사용자-인터랙션 감지에 걸리지 않게
      if (ll.length) programmaticMapView('fitBounds', ll, { padding: [40, 40], animate: true });
    };
    if (immediate) apply();
    else mapSyncTimer = setTimeout(apply, 140);
  }
  function applyZoom(km1, km2, immediate) {
    if (!(km2 > km1)) return;
    const minSpan = Math.max(0.1, totalKm / 1000);
    if (km2 - km1 < minSpan) {
      const c = (km1 + km2) / 2;
      km1 = c - minSpan / 2; km2 = c + minSpan / 2;
    }
    xViewStart = Math.max(0, km1);
    xViewEnd   = Math.min(totalKm, km2);
    drawBg(); drawMarker();
    drawFg(state);
    // 사용자 그래프 줌도 인터랙션 → 추적 자동 팔로우 일시 정지
    pauseTrackFollow();
    syncMapToView(immediate);
  }
  function resetZoom(immediate, opts) {
    opts = opts || {};
    xViewStart = 0; xViewEnd = totalKm;
    drawBg(); drawMarker();
    drawFg(state);
    if (!opts.silent) {
      pauseTrackFollow();
      syncMapToView(immediate !== false);
    }
  }
  elevApplyZoom = applyZoom;
  elevResetZoom = resetZoom;

  // ===== fg 그리기 (호버 시) =====
  function drawFg(state) {
    fg.clearRect(0, 0, W, H);
    if (!state) return;
    if (state.brush) {
      const { x1, x2 } = state.brush;
      fg.fillStyle = 'rgba(25,118,210,0.18)';
      fg.fillRect(x1, padT, x2 - x1, innerH);
      fg.strokeStyle = 'rgba(25,118,210,0.7)'; fg.lineWidth = 1;
      fg.strokeRect(x1, padT, x2 - x1, innerH);
    }
    if (state.cursorX != null) {
      fg.strokeStyle = '#333'; fg.lineWidth = 1;
      fg.beginPath();
      fg.moveTo(state.cursorX, padT); fg.lineTo(state.cursorX, H - padB);
      fg.stroke();
    }
    const s = state.seg;
    if (s) {
      const xx = xOf(s.cumDistance / 1000);
      const farRight = xx > W - padR - 70;
      const labX = xx + (farRight ? -8 : 8);
      const align = farRight ? 'right' : 'left';
      const drawDot = (x, y, fill) => {
        fg.beginPath(); fg.arc(x, y, 4, 0, Math.PI * 2);
        fg.fillStyle = fill; fg.fill();
        fg.strokeStyle = '#fff'; fg.lineWidth = 1.5; fg.stroke();
      };
      const drawLab = (x, y, text, fill) => {
        fg.font = 'bold 12px -apple-system,system-ui,sans-serif';
        fg.textAlign = align;
        fg.lineWidth = 3; fg.lineJoin = 'round';
        fg.strokeStyle = '#fff'; fg.strokeText(text, x, y);
        fg.fillStyle = fill; fg.fillText(text, x, y);
      };
      const ele = s.b.ele;
      if (typeof ele === 'number') {
        const ey = yEle(ele);
        drawDot(xx, ey, '#444');
        drawLab(labX, ey - 8, ele.toFixed(0) + ' m', '#222');
      }
      const v = s.effectiveSpeed;
      if (typeof v === 'number') {
        const vy = yV(v);
        drawDot(xx, vy, '#1976d2');
        drawLab(labX, vy + 14, v.toFixed(1) + ' km/h', '#1976d2');
      }
    }
  }

  function updateTooltip(s) {
    const pad2 = n => String(n).padStart(2, '0');
    const eta = new Date(s.etaMs);
    const ele = s.b.ele;
    const v = s.effectiveSpeed;
    tEl.km.textContent = (s.cumDistance / 1000).toFixed(1) + ' km';
    tEl.ele.textContent = (typeof ele === 'number') ? ele.toFixed(0) + ' m' : '—';
    if (typeof s.grade === 'number') {
      const arrow = s.grade > 0.3 ? '↗' : s.grade < -0.3 ? '↘' : '→';
      tEl.grade.textContent = arrow + ' ' + s.grade.toFixed(1) + '%';
      tEl.grade.className = 't-grade ' + (s.grade > 0.3 ? 'head' : s.grade < -0.3 ? 'tail' : 'e');
    } else { tEl.grade.textContent = '—'; tEl.grade.className = 't-grade'; }
    if (typeof v === 'number') { tEl.speed.textContent = v.toFixed(1) + ' km/h'; tEl.speed.className = 't-speed v'; }
    else { tEl.speed.textContent = '—'; tEl.speed.className = 't-speed'; }
    if (typeof s.windSpeed === 'number') {
      const tag = s.score > 0.05 ? '순풍' : s.score < -0.05 ? '역풍' : '중립';
      tEl.wind.textContent = (s.windSpeed/3.6).toFixed(1) + ' m/s ' + tag;
      tEl.wind.className = 't-wind ' + (s.score > 0.05 ? 'tail' : s.score < -0.05 ? 'head' : 'e');
    } else { tEl.wind.textContent = '—'; tEl.wind.className = 't-wind'; }
    tEl.wx.textContent = (s.weatherCode != null) ? weatherEmoji(s.weatherCode) + ' ' + weatherText(s.weatherCode) : '—';
    tEl.temp.textContent = (typeof s.temperature === 'number') ? s.temperature.toFixed(1) + '°C' : '—';
    tEl.rain.textContent = (s.precip != null && s.precip >= 0.05) ? ' | 강수 💧' + s.precip.toFixed(1) + 'mm' : '';
    tEl.hum.textContent = (s.humidity != null) ? ' | 습도 ' + s.humidity.toFixed(0) + '%' : '';
    tEl.eta.textContent = pad2(eta.getHours()) + ':' + pad2(eta.getMinutes());
    tooltip.style.display = 'block';
  }

  // ===== 인터랙션 =====
  let state = { cursorX: null, seg: null, brush: null };
  let lastSeg = null, dragStart = null, mmRaf = 0, mmEv = null;

  function hideHover() {
    state = { cursorX: null, seg: null, brush: null };
    drawFg(null);
    tooltip.style.display = 'none';
    clearHoverMarkers();
    lastSeg = null;
  }

  function handleMove(clientX) {
    const rect = fgCanvas.getBoundingClientRect();
    const px = clientX - rect.left;
    if (dragStart != null) {
      const x1 = Math.max(padL, Math.min(W - padR, Math.min(dragStart, px)));
      const x2 = Math.max(padL, Math.min(W - padR, Math.max(dragStart, px)));
      state.brush = { x1, x2 };
      drawFg(state);
      return;
    }
    state.cursorX = Math.max(padL, Math.min(W - padR, px));
    const viewSpan = xViewEnd - xViewStart;
    const target = (xViewStart + ((state.cursorX - padL) / innerW) * viewSpan) * 1000;
    const s = findSegmentByDist(segments, target);
    if (!s) { drawFg(state); return; }
    if (s !== lastSeg) {
      lastSeg = s;
      state.seg = s;
      updateTooltip(s);
      showWindAnimation(s, [s.b.lat, s.b.lon]);
    }
    drawFg(state);
  }

  fgCanvas.addEventListener('mousemove', (ev) => {
    mmEv = ev;
    if (mmRaf) return;
    mmRaf = requestAnimationFrame(() => { mmRaf = 0; handleMove(mmEv.clientX); });
  });
  fgCanvas.addEventListener('mouseleave', () => {
    if (mmRaf) { cancelAnimationFrame(mmRaf); mmRaf = 0; }
    hideHover();
  });

  fgCanvas.addEventListener('mousedown', (ev) => {
    const rect = fgCanvas.getBoundingClientRect();
    dragStart = ev.clientX - rect.left;
    state.brush = { x1: dragStart, x2: dragStart };
    drawFg(state);
    tooltip.style.display = 'none';
    ev.preventDefault();
  });
  if (elevMouseUp) document.removeEventListener('mouseup', elevMouseUp);
  elevMouseUp = (ev) => {
    if (dragStart == null) return;
    const rect = fgCanvas.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const x1 = Math.min(dragStart, x), x2 = Math.max(dragStart, x);
    state.brush = null;
    drawFg(state);
    if (x2 - x1 > 4) {
      const viewSpan = xViewEnd - xViewStart;
      const km1 = xViewStart + ((x1 - padL) / innerW) * viewSpan;
      const km2 = xViewStart + ((x2 - padL) / innerW) * viewSpan;
      // 그래프 줌 + 지도 fitBounds 즉시 동기화
      applyZoom(km1, km2, true);
    }
    dragStart = null;
  };
  document.addEventListener('mouseup', elevMouseUp);

  fgCanvas.addEventListener('dblclick', () => {
    resetZoom(true);
  });

  fgCanvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const rect = fgCanvas.getBoundingClientRect();
    const px = ev.clientX - rect.left;
    const viewSpan = xViewEnd - xViewStart;
    const cursorKm = xViewStart + ((Math.max(padL, Math.min(W - padR, px)) - padL) / innerW) * viewSpan;

    // Ctrl/⌘ + 휠 = 그래프 X축 줌 (커서 위치 기준 in/out)
    if (ev.ctrlKey || ev.metaKey) {
      const factor = ev.deltaY < 0 ? 0.8 : 1.25;
      let newSpan = Math.max(0.1, Math.min(totalKm, viewSpan * factor));
      const ratio = (cursorKm - xViewStart) / Math.max(1e-9, viewSpan);
      let newStart = cursorKm - newSpan * ratio;
      let newEnd   = newStart + newSpan;
      if (newStart < 0) { newEnd -= newStart; newStart = 0; }
      if (newEnd > totalKm) { newStart -= (newEnd - totalKm); newEnd = totalKm; }
      newStart = Math.max(0, newStart);
      applyZoom(newStart, newEnd);
      return;
    }

    // 일반 휠 = 지도 줌 (기존 동작 유지)
    const s = findSegmentByDist(segments, cursorKm * 1000);
    if (!s) return;
    const dir = ev.deltaY < 0 ? 0.75 : -0.75;  // 0.75 단위 섬세 줌
    const z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + dir));
    map.setView([s.b.lat, s.b.lon], z, { animate: true });
  }, { passive: false });

  // 모바일 터치 (단일 손가락 = 호버, 두 손가락 = 핀치 줌)
  let pinchState = null; // { km1, km2 } — 핀치 시작 시점의 손가락 km 앵커
  const onTouchStart = (ev) => {
    if (ev.touches.length >= 2) {
      ev.preventDefault();
      const rect = fgCanvas.getBoundingClientRect();
      const px1 = ev.touches[0].clientX - rect.left;
      const px2 = ev.touches[1].clientX - rect.left;
      const viewSpan = xViewEnd - xViewStart;
      const km1 = xViewStart + ((px1 - padL) / innerW) * viewSpan;
      const km2 = xViewStart + ((px2 - padL) / innerW) * viewSpan;
      pinchState = { km1, km2 };
      // 사용자 그래프 핀치 = 인터랙션 → 추적 자동 팔로우 즉시 일시 정지
      pauseTrackFollow();
      // 핀치 중에는 호버/brush 비활성
      tooltip.style.display = 'none';
      state.brush = null;
      state.cursorX = null;
      state.seg = null;
      drawFg(state);
      clearHoverMarkers();
      lastSeg = null;
      return;
    }
    const t = ev.touches[0];
    if (!t) return;
    ev.preventDefault();
    handleMove(t.clientX);
  };
  const onTouchMove = (ev) => {
    if (ev.touches.length >= 2 && pinchState) {
      ev.preventDefault();
      const rect = fgCanvas.getBoundingClientRect();
      const px1 = ev.touches[0].clientX - rect.left;
      const px2 = ev.touches[1].clientX - rect.left;
      const dpx = px2 - px1;
      if (Math.abs(dpx) < 4) return; // 너무 가까우면 무시 (수직축 핀치 등)
      const { km1, km2 } = pinchState;
      // 두 손가락 시작 km 앵커가 현재 px 위치에 매핑되도록 newSpan/newStart 계산
      const newSpan = (km2 - km1) * innerW / dpx;
      if (newSpan < 0.1) return;
      let s = km1 - ((px1 - padL) / innerW) * newSpan;
      let e = s + newSpan;
      if (s < 0)        { e -= s;            s = 0; }
      if (e > totalKm)  { s -= (e - totalKm); e = totalKm; }
      s = Math.max(0, s); e = Math.min(totalKm, e);
      if (e - s < 0.1) return;
      xViewStart = s; xViewEnd = e;
      drawBg(); drawMarker(); drawFg(state);
      syncMapToView(false); // 핀치 중에는 디바운스로 부드럽게 따라가게
      return;
    }
    if (pinchState) return; // 한 손가락이 떼지기 전엔 호버 비활성
    const t = ev.touches[0];
    if (!t) return;
    ev.preventDefault();
    handleMove(t.clientX);
  };
  fgCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
  fgCanvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
  let lastTapMs = 0;
  const onTouchEnd = (ev) => {
    if (pinchState) {
      if (ev.touches.length < 2) {
        pinchState = null;
        syncMapToView(true); // 핀치 종료 시 마지막 지도 동기화 1회 즉시
      }
      return;
    }
    setTimeout(() => { if (!dragStart) hideHover(); }, 1800);
    const now = Date.now();
    if (now - lastTapMs < 320) {
      // 더블탭: 그래프 줌 리셋 + 지도 전체 fitBounds
      resetZoom(true);
    }
    lastTapMs = now;
  };
  fgCanvas.addEventListener('touchend', onTouchEnd);
  fgCanvas.addEventListener('touchcancel', onTouchEnd);
}

let gpxText = null;

// ===== GPS 추적 자동 팔로우 헬퍼 =====
// map.setView/panTo/fitBounds를 사용자 인터랙션으로 오인하지 않도록 카운터 가드
function programmaticMapView(method, ...args) {
  programmaticMapChange++;
  try { map[method](...args); }
  finally { setTimeout(() => { programmaticMapChange = Math.max(0, programmaticMapChange - 1); }, 60); }
}
function pauseTrackFollow() {
  if (trackWatchId == null) return; // 추적 중일 때만 의미 있음
  if (!trackAutoFollow) return;
  trackAutoFollow = false;
  setRecenterState('paused');
  const statusEl = document.getElementById('status');
  if (statusEl) statusEl.textContent = '⏸ 자동 팔로우 일시 정지 — 오른쪽 하단 ⊕ 버튼으로 GPS 위치로 재개';
}
function resumeTrackFollow() {
  if (trackWatchId == null) return;
  trackAutoFollow = true;
  trackFirstFix = true; // 다음 fix에서 setView로 초기 줌으로 복귀
  setRecenterState('tracking');
  // 그래프 줌도 같이 리셋 — silent 모드로 (지도 fitBounds/일시정지 트리거 안 함)
  if (typeof elevResetZoom === 'function') elevResetZoom(false, { silent: true });
  if (trackLastFix) {
    programmaticMapView('setView', [trackLastFix.lat, trackLastFix.lon], TRACK_INITIAL_ZOOM, { animate: true });
  }
}
function ensureRecenterControl() {
  if (recenterControl) return;
  const Recenter = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd: () => {
      const div = L.DomUtil.create('div', 'leaflet-bar recenter-btn');
      div.innerHTML =
        '<a href="#" role="button" aria-label="GPS 추적 위치" title="GPS 위치로 추적 재개">'
        + '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" '
        + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<circle class="ring" cx="12" cy="12" r="8"></circle>'
        + '<line x1="12" y1="2" x2="12" y2="6"></line>'
        + '<line x1="12" y1="18" x2="12" y2="22"></line>'
        + '<line x1="2" y1="12" x2="6" y2="12"></line>'
        + '<line x1="18" y1="12" x2="22" y2="12"></line>'
        + '<line class="sweep" x1="12" y1="12" x2="12" y2="4.5"></line>'
        + '<circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"></circle>'
        + '</svg></a>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(div, 'click', (e) => { e.preventDefault(); resumeTrackFollow(); });
      div.style.display = 'none';
      return div;
    }
  });
  recenterControl = new Recenter();
  recenterControl.addTo(map);
}
// state: 'tracking' (자동 팔로우 ON, 레이더 sweep) | 'paused' (일시 정지, 주황) | 'hidden'
function setRecenterState(state) {
  if (state === 'hidden') {
    if (recenterControl) {
      const el = recenterControl.getContainer();
      if (el) el.style.display = 'none';
      const a = el && el.querySelector('a');
      if (a) a.classList.remove('tracking', 'paused');
    }
    return;
  }
  ensureRecenterControl();
  const el = recenterControl.getContainer();
  if (!el) return;
  el.style.display = '';
  const a = el.querySelector('a');
  if (a) {
    a.classList.toggle('tracking', state === 'tracking');
    a.classList.toggle('paused',   state === 'paused');
    a.title = state === 'tracking' ? 'GPS 추적 중' : 'GPS 위치로 추적 재개';
  }
}
// 하위 호환 — 기존 호출처 보존
function showRecenterControl() { setRecenterState('paused'); }
function hideRecenterControl() { setRecenterState('hidden'); }
// 지도에서 사용자가 직접 드래그/줌하면 자동 팔로우 일시 정지
map.on('movestart', () => { if (programmaticMapChange === 0) pauseTrackFollow(); });
map.on('zoomstart', () => { if (programmaticMapChange === 0) pauseTrackFollow(); });

// 🛰 GPS 추적: watchPosition으로 위치 변화에 따라 지도 자동 따라가기 (heading-up)
(function setupTrackToggle() {
  const btn = document.getElementById('trackToggle');
  function onPos(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const h = computeTrackHeading(lat, lon, pos.coords.heading);
    trackLastFix = { lat, lon };

    // 1) 자동 팔로우 ON일 때만 지도 이동 — 첫 fix는 즉시 setView (animate 없이)
    if (trackAutoFollow) {
      if (trackFirstFix) {
        trackFirstFix = false;
        programmaticMapView('setView', [lat, lon], TRACK_INITIAL_ZOOM, { animate: false });
      } else {
        programmaticMapView('panTo', [lat, lon], { animate: true, duration: 0.6 });
      }
    }
    // 2) 마커 + 툴팁 — 분석된 segment 또는 캐시된 trackWind 활용 (즉시)
    updateCurrentLocationMarker(lat, lon);
    updateLocMarkerWindColor(lat, lon, h);
    updateTrackTooltip(lat, lon, h);
    // 3) 풍 fetch (분석 안 했을 때) — 비동기 결과로 마커·툴팁 다시 갱신
    fetchCurrentWindForTracking(lat, lon).then(() => {
      updateCurrentLocationMarker(lat, lon);
      updateLocMarkerWindColor(lat, lon, h);
      updateTrackTooltip(lat, lon, h);
    });
    // 4) heading-up 회전 (heading 추정됐을 때만, compass 모드면 compass에 양보)
    if (h != null && !compassMode) applyMapRotation(h);

    // 5) 경사 그래프 — 현재 위치를 가장 가까운 segment에 매핑 + ±1km 줌 슬라이딩
    if (lastSegments && lastSegments.length) {
      const s = findNearestSegment(lastSegments, lat, lon);
      if (s) {
        const km = s.cumDistance / 1000;
        currentTrackProgressKm = km;
        // 50m 이상 이동 시에만 그래프 view 재설정 (성능)
        if (Math.abs(km - (trackLastGraphKm ?? -999)) >= 0.05 &&
            typeof window._elevSetView === 'function') {
          window._elevSetView(km - 1, km + 1);
          trackLastGraphKm = km;
        } else if (typeof elevUpdateMarker === 'function') {
          elevUpdateMarker();
        }
      }
    }

    const coord = `${lat.toFixed(5)}, ${lon.toFixed(5)}` + (h != null ? ` (${h.toFixed(0)}°)` : '');
    document.getElementById('status').textContent =
      trackAutoFollow ? `🛰 추적: ${coord}` : `⏸ 일시정지 · ${coord} · ⊕ 버튼으로 재개`;
  }
  function start() {
    if (!navigator.geolocation) {
      document.getElementById('status').textContent = '브라우저가 위치 API를 지원하지 않습니다.';
      return;
    }
    trackFirstFix = true;
    trackAutoFollow = true;
    setRecenterState('tracking');
    trackHeadingPrev = null;
    trackHeadingSmooth = null;
    trackWatchId = navigator.geolocation.watchPosition(onPos, (err) => {
      document.getElementById('status').textContent = '추적 오류: ' + err.message;
      stop();
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
    btn.classList.add('active');
    btn.textContent = '🛰 추적 중 (탭하여 중지)';
    document.getElementById('panel').classList.add('tracking');
    document.getElementById('status').textContent = 'GPS 추적 중…';
    autoCollapseOnMobile();
  }
  function stop() {
    if (trackWatchId != null) {
      navigator.geolocation.clearWatch(trackWatchId);
      trackWatchId = null;
    }
    clearMapRotation();
    clearTrackTooltip();
    // 경사 그래프 현재위치 마커 제거 + 줌 리셋(전체 범위)
    currentTrackProgressKm = null;
    trackLastGraphKm = null;
    if (typeof window._elevSetView === 'function' && lastSegments && lastSegments.length) {
      const total = lastSegments[lastSegments.length - 1].cumDistance / 1000;
      window._elevSetView(0, total);
    } else if (typeof elevUpdateMarker === 'function') {
      elevUpdateMarker();
    }
    // 자동 팔로우 상태/재개 버튼 정리
    trackAutoFollow = false;
    trackLastFix = null;
    setRecenterState('hidden');
    btn.classList.remove('active');
    btn.textContent = '🛰 추적 시작';
    document.getElementById('panel').classList.remove('tracking');
  }
  btn.addEventListener('click', () => {
    if (trackWatchId != null) stop(); else start();
  });
})();

// 📍 현재 GPS 위치 표시 (+ GPX가 있으면 가장 가까운 점부터 분석)
document.getElementById('useCurrentLoc').addEventListener('click', () => {
  const status = document.getElementById('status');
  const btn = document.getElementById('useCurrentLoc');
  if (!navigator.geolocation) { status.textContent = '브라우저가 위치 API를 지원하지 않습니다.'; return; }
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = '📍 위치 확인 중…';
  status.textContent = '현재 위치 확인 중…';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    btn.disabled = false;
    btn.textContent = prevLabel;
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    // 1) 지도 줌·이동 (이미지 수준 줌 17)
    map.setView([lat, lon], 17, { animate: true });

    // 2) 출발 시각을 지금으로 갱신
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('startTime').value =
      `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

    // 3) 현재 위치 풍 데이터 fetch (분석 안 했어도 동작)
    await fetchCurrentWindForTracking(lat, lon);

    // 4) 펄스 마커 + 풍 입자 + 마커 아래 툴팁 표시 (정지 상태라 heading 미정)
    updateCurrentLocationMarker(lat, lon);
    updateLocMarkerWindColor(lat, lon, null);
    updateTrackTooltip(lat, lon, null);

    // 5) GPX가 있으면 가까운 점부터 분석 시작 (분석 후에도 줌 17 유지)
    if (gpxText) {
      const oriented = applyDirection(parseGPX(gpxText), document.getElementById('direction').value);
      const { distance } = findNearestPointIndex(oriented, lat, lon);
      if (distance > 5000) {
        if (!confirm(`현재 위치가 GPX 경로에서 ${(distance/1000).toFixed(1)}km 떨어져 있습니다.\n계속 진행할까요?`)) {
          status.textContent = `현재 위치 (${lat.toFixed(5)}, ${lon.toFixed(5)}) — 분석 취소`;
          return;
        }
      }
      pendingStartLatLon = { lat, lon };
      skipNextFitBounds = true;  // 분석 후 줌 17 유지 (fitBounds 건너뜀)
      status.textContent = `현재 위치 (${lat.toFixed(5)}, ${lon.toFixed(5)}) 기준으로 분석 시작…`;
      document.getElementById('run').click();
    } else {
      status.textContent = `현재 위치 (${lat.toFixed(5)}, ${lon.toFixed(5)}) 표시 — GPX 업로드 후 [분석] 클릭 시 코스 분석`;
    }
  }, (err) => {
    btn.disabled = false;
    btn.textContent = prevLabel;
    status.textContent = '위치 가져오기 실패: ' + err.message;
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
});

document.getElementById('gpx').addEventListener('change', async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  gpxText = await f.text();
  document.getElementById('status').textContent = `${f.name} 로드됨 (${(f.size/1024).toFixed(1)} KB)`;
});

// 입력 모드 토글 (평속 ↔ 파워)
document.getElementById('mode').addEventListener('change', (e) => {
  const power = e.target.value === 'power';
  document.getElementById('speedLabel').style.display  = power ? 'none' : '';
  document.getElementById('powerLabel').style.display  = power ? '' : 'none';
  document.getElementById('weightLabel').style.display = power ? '' : 'none';
});

document.getElementById('run').addEventListener('click', async () => {
  const status = document.getElementById('status');
  const btn = document.getElementById('run');
  if (!gpxText) { status.textContent = 'GPX 파일을 먼저 선택하세요.'; return; }
  const startStr = document.getElementById('startTime').value;
  if (!startStr) { status.textContent = '출발 시각을 입력하세요.'; return; }
  const mode = document.getElementById('mode').value;
  const speedKmh = parseFloat(document.getElementById('speed').value);
  const powerW   = parseFloat(document.getElementById('power').value);
  const massKg   = parseFloat(document.getElementById('weight').value);
  const restMin  = parseFloat(document.getElementById('restMin').value) || 0;
  const restEveryKm = parseFloat(document.getElementById('restEveryKm').value) || 0;
  if (mode === 'speed' && !(speedKmh > 0)) { status.textContent = '평속을 올바르게 입력하세요.'; return; }
  if (mode === 'power' && !(powerW > 0))   { status.textContent = '파워를 올바르게 입력하세요.'; return; }
  const model = 'ecmwf_ifs025'; // ECMWF 고정

  btn.disabled = true;
  try {
    const startMs = new Date(startStr).getTime();
    const direction = document.getElementById('direction').value;
    let rawPts = parseGPX(gpxText);

    // 현재 위치 기준이면 가장 가까운 점부터 자르기 (방향 적용 전)
    let trimNote = '';
    if (pendingStartLatLon) {
      const oriented = applyDirection(rawPts, direction);
      const { index, distance } = findNearestPointIndex(oriented, pendingStartLatLon.lat, pendingStartLatLon.lon);
      if (oriented.length - index < 2) {
        throw new Error('현재 위치가 GPX 경로 끝부분이거나 너무 멀어 분석할 수 없습니다.');
      }
      rawPts = oriented.slice(index);
      trimNote = ` (현재위치 ~${(distance).toFixed(0)}m, ${index}점 건너뜀)`;
      pendingStartLatLon = null;  // 1회 사용 후 해제
    }

    status.textContent = `트랙 포인트 ${rawPts.length}개${trimNote} → 고도 확인 중…`;
    const filled = await fillElevationIfMissing(rawPts, status);
    // 현재위치 trim을 이미 한 경우엔 oriented 점을 그대로 사용 (중복 방지)
    const pts = trimNote ? rawPts : applyDirection(rawPts, direction);
    const dirLabel = direction === 'reverse' ? '역방향' : direction === 'round' ? '왕복' : '정방향';
    if (filled > 0) status.textContent = `고도 ${filled}개 보강 → ${dirLabel} segment 생성 중…`;
    else status.textContent = `${dirLabel} segment 생성 중…`;
    const initialKmh = (mode === 'speed') ? speedKmh : 25;
    const segs = buildSegments(pts, startMs, initialKmh);
    if (segs.length === 0) throw new Error('유효한 segment가 없습니다.');
    status.textContent = `segment ${segs.length}개. 풍 데이터 조회 중… (모델: ${model})`;
    // 1) 좌표 그리드별 hourly 데이터 fetch (캐시)
    const windCache = await fetchWindGrid(segs, status, model);
    // 2) 1차 매핑 (1차 ETA 기준)
    mapWindToSegments(segs, windCache);
    // 3) 휴식 반영 ETA + 속도 계산
    let kin = applyKinematics(segs, mode, speedKmh, powerW, massKg, startMs, restMin, restEveryKm);
    // 4) 보정된 ETA로 풍 재매핑 → 5) 한 번 더 계산하여 score/속도 정합성 확보
    mapWindToSegments(segs, windCache);
    kin = applyKinematics(segs, mode, speedKmh, powerW, massKg, startMs, restMin, restEveryKm);

    drawSegments(segs);
    const totalM = segs.reduce((a, s) => a + s.distance, 0);
    const totalH = (segs[segs.length-1].cumTimeSec || 0) / 3600;
    const avgKmh = totalH > 0 ? (totalM/1000) / totalH : (speedKmh || 0);
    renderGauge(segs, totalH);
    renderStats(segs, startMs, totalH, avgKmh, kin);
    renderElevation(segs, avgKmh);
    lastSegments = segs;
    lastAvgKmh   = avgKmh;

    // 최적시각 추천용 컨텍스트 저장 + 버튼 활성화
    analysis = {
      segments: segs, cache: windCache, startMs,
      mode, speed: speedKmh, power: powerW, mass: massKg,
      restMin, restEvery: restEveryKm,
      direction
    };
    document.getElementById('findBestTime').disabled = false;
    document.getElementById('aiPrompt').disabled = false;
    document.getElementById('bestResult').textContent = '';
    autoCollapseOnMobile();
    const restNote = kin.restCount > 0
      ? `, 휴식 ${kin.restCount}회 ×${restMin}분`
      : '';
    status.textContent = `완료 (${dirLabel}, segment ${segs.length}개, 평균 ${avgKmh.toFixed(1)} km/h${restNote})`;
  } catch (e) {
    console.error(e);
    status.textContent = '오류: ' + e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
